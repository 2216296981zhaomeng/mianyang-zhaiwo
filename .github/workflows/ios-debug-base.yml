name: iOS Custom Debug Base

on:
  workflow_dispatch:
    inputs:
      resources_url:
        description: URL of the app-ios resources zip (contains __UNI__607FC4F/ and uni_modules/)
        required: true
        default: https://github.com/2216296981zhaomeng/mianyang-zhaiwo/releases/download/ios-resources-1.1.04-1104-20261030/app-ios-resources-1.1.04-1104.zip
      sdk_url:
        description: DCloud iOS Vapor SDK zip
        required: false
        default: https://web-ext-storage.dcloud.net.cn/uni-app-x/sdk/iOS-Vapor/UniAppXSDK-iOS-Vapor@5.33.zip
      runtime_version:
        description: DCloud SDK version matching the exported resources
        required: true
        default: "5.33"
      version_name:
        description: App version matching the exported resources
        required: true
        default: "1.1.04"
      run_plugins:
        description: Build UTS plugin xcframeworks (set false only for pipeline smoke tests)
        required: false
        default: "true"
      build_number:
        description: CFBundleVersion (increase for every App Store upload)
        required: false
        default: "1104"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h "$RUNNER_TEMP"

      - name: Cache DCloud iOS SDK
        uses: actions/cache@v4
        with:
          path: build/cache/UniAppXSDK-iOS-Vapor.zip
          key: dcloud-ios-vapor-${{ hashFiles('.github/workflows/ios-appstore.yml') }}-${{ inputs.runtime_version }}

      - name: Download DCloud iOS SDK
        env:
          SDK_URL: ${{ inputs.sdk_url }}
          SDK_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          if [ "$SDK_VERSION" != "5.33" ]; then
            echo "Unsupported SDK version: update the pinned checksum before changing versions" >&2
            exit 1
          fi
          mkdir -p build/cache
          if [ ! -s build/cache/UniAppXSDK-iOS-Vapor.zip ]; then
            curl --http1.1 -fL --retry 5 --retry-delay 5 --retry-all-errors -o build/cache/UniAppXSDK-iOS-Vapor.zip "$SDK_URL"
          fi
          echo "a3661ad84946fde3583f6368650a0e45df184d7352e0b15997815b85d034a9ab  build/cache/UniAppXSDK-iOS-Vapor.zip" | shasum -a 256 -c -
          ls -lh build/cache/UniAppXSDK-iOS-Vapor.zip

      - name: Download app resources
        env:
          RESOURCES_URL: ${{ inputs.resources_url }}
        run: |
          mkdir -p build/cache
          curl --http1.1 -fL --retry 5 --retry-delay 5 --retry-all-errors -o build/cache/app-ios-resources.zip "$RESOURCES_URL"
          echo "cb07796e02e9d4724fae7c838ae8cb8fc5b31d5d682463c9c0d9ca8bc2475a72  build/cache/app-ios-resources.zip" | shasum -a 256 -c -
          ls -lh build/cache/app-ios-resources.zip

      - name: Import signing identity and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DEV_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_DEV_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="build-$RANDOM-$RANDOM"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          umask 077
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/development.p12"
          security import "$RUNNER_TEMP/development.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/development.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/development.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/zhaiwomls-my-dev.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install xcodeproj and CocoaPods
        run: |
          gem install xcodeproj --no-document
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
          pod --version

      - name: Build IPA
        env:
          RUN_PLUGINS: ${{ inputs.run_plugins }}
          VERSION_CODE: ${{ inputs.build_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          bash scripts/ios/build-debug-base.sh

      - name: Verify IPA
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' | head -n 1)
          echo "IPA=$IPA"
          unzip -q "$IPA" -d build/ipa-check
          APP=$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' | head -n 1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          codesign -dvvv "$APP" 2>&1 | sed -n '1,12p'
          /usr/libexec/PlistBuddy -c 'Print :uniapp-x:ipatype' "$APP/Info.plist" | grep -x 1
          test -d "$APP/Frameworks/DCloudDebugServe.framework" || { echo "Missing DCloud debug runtime" >&2; exit 1; }
          if [ -f "$APP/Frameworks/unimoduleZwTencentIm.framework/unimoduleZwTencentIm" ]; then
            test -f "$APP/Frameworks/ImSDK_Plus.framework/ImSDK_Plus" || { echo "Missing Tencent IM runtime" >&2; exit 1; }
            xcrun lipo "$APP/Frameworks/ImSDK_Plus.framework/ImSDK_Plus" -verify_arch arm64
            codesign --verify --strict "$APP/Frameworks/ImSDK_Plus.framework"
          fi
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/profile-check.plist"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile-check.plist" | grep -x true
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-custom-debug-base
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build-logs
          path: |
            build/logs/**
          if-no-files-found: ignore

      - name: Report runner disk usage
        if: always()
        run: |
          df -h "$RUNNER_TEMP"
          du -sh build/cache build/sdk build/resources build/plugins build/plugin-build build/export build/logs 2>/dev/null || true
