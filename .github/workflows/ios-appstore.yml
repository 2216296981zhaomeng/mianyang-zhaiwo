name: iOS App Store IPA

on:
  workflow_dispatch:
    inputs:
      resources_url:
        description: URL of the app-ios resources zip (contains __UNI__607FC4F/ and uni_modules/)
        required: true
      sdk_url:
        description: DCloud iOS Vapor SDK zip
        required: false
        default: https://web-ext-storage.dcloud.net.cn/uni-app-x/sdk/iOS-Vapor/UniAppXSDK-iOS-Vapor@5.26.zip
      run_plugins:
        description: Build UTS plugin xcframeworks (set false only for pipeline smoke tests)
        required: false
        default: "true"
      build_number:
        description: CFBundleVersion (increase for every App Store upload)
        required: false
        default: "1102"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Cache DCloud iOS SDK
        uses: actions/cache@v4
        with:
          path: build/cache/UniAppXSDK-iOS-Vapor.zip
          key: dcloud-ios-vapor-${{ hashFiles('.github/workflows/ios-appstore.yml') }}-5.26

      - name: Download DCloud iOS SDK
        env:
          SDK_URL: ${{ inputs.sdk_url }}
        run: |
          mkdir -p build/cache
          if [ ! -s build/cache/UniAppXSDK-iOS-Vapor.zip ]; then
            curl --http1.1 -fL --retry 5 --retry-delay 5 --retry-all-errors -o build/cache/UniAppXSDK-iOS-Vapor.zip "$SDK_URL"
          fi
          ls -lh build/cache/UniAppXSDK-iOS-Vapor.zip

      - name: Download app resources
        env:
          RESOURCES_URL: ${{ inputs.resources_url }}
        run: |
          mkdir -p build/cache
          curl --http1.1 -fL --retry 5 --retry-delay 5 --retry-all-errors -o build/cache/app-ios-resources.zip "$RESOURCES_URL"
          ls -lh build/cache/app-ios-resources.zip

      - name: Import signing identity and profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS="build-$RANDOM-$RANDOM"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          umask 077
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/appstore.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/pingguopro.mobileprovision"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install xcodeproj and CocoaPods
        run: |
          gem install xcodeproj --no-document
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
          pod --version

      - name: Build IPA
        env:
          RUN_PLUGINS: ${{ inputs.run_plugins }}
          VERSION_CODE: ${{ inputs.build_number }}
        run: |
          bash scripts/ios/build-ipa.sh

      - name: Verify IPA
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' | head -n 1)
          echo "IPA=$IPA"
          unzip -q "$IPA" -d build/ipa-check
          APP=$(find build/ipa-check/Payload -maxdepth 1 -name '*.app' | head -n 1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"
          codesign -dvvv "$APP" 2>&1 | sed -n '1,12p'
          shasum -a 256 "$IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-appstore-ipa
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/logs/**
          if-no-files-found: ignore
